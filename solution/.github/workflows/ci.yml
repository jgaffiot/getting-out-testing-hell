name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra solution

      - name: Run tests with coverage
        run: |
          uv run pytest solution/tests/ \
            --tb=short \
            -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80
        # No secrets needed — Testcontainers starts its own PostgreSQL
        # No app server needed — TestClient runs in-process

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

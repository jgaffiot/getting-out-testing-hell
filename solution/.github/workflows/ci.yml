name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Demonstrates actions/cache: restores uv's download/build cache from a
      # previous run so `uv sync` doesn't refetch/rebuild every dependency.
      # The key is scoped to uv.lock's hash so it invalidates when deps change;
      # restore-keys lets a partial (stale) cache still be reused as a base.
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --extra solution

      - name: Run tests with coverage
        run: |
          uv run pytest solution/tests/ \
            --tb=short \
            -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80
        # No secrets needed — Testcontainers starts its own PostgreSQL
        # No app server needed — TestClient runs in-process

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
